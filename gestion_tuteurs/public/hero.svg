<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Application Gobuch sur telephone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <clipPath id="screen"><rect x="180" y="132" width="280" height="536" rx="30"/></clipPath>
  </defs>

  <rect width="640" height="800" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="120" r="150" fill="#7C3AED" opacity=".28"/>
  <circle cx="560" cy="690" r="170" fill="#F59E0B" opacity=".16"/>

  <!-- Telephone -->
  <rect x="168" y="120" width="304" height="560" rx="42" fill="#0F0B24" opacity=".55"/>
  <rect x="176" y="128" width="288" height="544" rx="34" fill="#2E1065"/>
  <g clip-path="url(#screen)">
    <rect x="180" y="132" width="280" height="536" fill="#241052"/>
    <rect x="272" y="146" width="96" height="10" rx="5" fill="#0F0B24" opacity=".8"/>

    <text x="204" y="206" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Bonjour Amina</text>

    <!-- Tuiles -->
    <rect x="204" y="228" width="76" height="66" rx="16" fill="url(#accent)"/>
    <text x="242" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">12</text>
    <text x="242" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#E9D5FF">Cours</text>

    <rect x="288" y="228" width="76" height="66" rx="16" fill="#F59E0B"/>
    <text x="326" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#4A2A00">84%</text>
    <text x="326" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C4A03">Score</text>

    <rect x="372" y="228" width="64" height="66" rx="16" fill="#059669"/>
    <text x="404" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">#3</text>
    <text x="404" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#D1FAE5">Rang</text>

    <!-- Carte cours -->
    <rect x="204" y="312" width="232" height="96" rx="18" fill="#FFFFFF" opacity=".10"/>
    <text x="220" y="338" font-family="system-ui, sans-serif" font-size="10" fill="#C4B5FD">EN COURS</text>
    <text x="220" y="360" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Maths — Derivation</text>
    <rect x="220" y="374" width="200" height="7" rx="4" fill="#1E1B4B"/>
    <rect x="220" y="374" width="120" height="7" rx="4" fill="#FBBF24"/>
    <text x="220" y="398" font-family="system-ui, sans-serif" font-size="10" fill="#C4B5FD">60% complete</text>

    <!-- Carte defi -->
    <rect x="204" y="424" width="232" height="72" rx="18" fill="#FBBF24"/>
    <circle cx="234" cy="460" r="16" fill="#FDE68A"/>
    <text x="234" y="467" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17">⚡</text>
    <text x="260" y="454" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A2A00">Defi en cours</text>
    <text x="260" y="472" font-family="system-ui, sans-serif" font-size="10" fill="#7C4A03">Physique · 12 joueurs</text>

    <!-- Liste -->
    <rect x="204" y="512" width="232" height="46" rx="14" fill="#FFFFFF" opacity=".07"/>
    <circle cx="228" cy="535" r="11" fill="#7C3AED"/>
    <rect x="248" y="527" width="112" height="7" rx="4" fill="#FFFFFF" opacity=".55"/>
    <rect x="248" y="541" width="72" height="6" rx="3" fill="#FFFFFF" opacity=".30"/>

    <rect x="204" y="570" width="232" height="46" rx="14" fill="#FFFFFF" opacity=".07"/>
    <circle cx="228" cy="593" r="11" fill="#059669"/>
    <rect x="248" y="585" width="96" height="7" rx="4" fill="#FFFFFF" opacity=".55"/>
    <rect x="248" y="599" width="130" height="6" rx="3" fill="#FFFFFF" opacity=".30"/>
  </g>

  <!-- Badges flottants -->
  <g>
    <rect x="52" y="330" width="168" height="62" rx="18" fill="#FFFFFF"/>
    <circle cx="84" cy="361" r="16" fill="#FEF3C7"/>
    <text x="84" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🏆</text>
    <text x="110" y="356" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Rang #1 en SVT</text>
    <text x="110" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Ce mois-ci</text>
  </g>
  <g>
    <rect x="424" y="536" width="168" height="62" rx="18" fill="#FFFFFF"/>
    <circle cx="456" cy="567" r="16" fill="#D1FAE5"/>
    <text x="456" y="574" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">✅</text>
    <text x="482" y="562" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">QCM termine</text>
    <text x="482" y="580" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">18/20 — Excellent</text>
  </g>
</svg>
